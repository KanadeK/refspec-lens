[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "refspec-lens"
version = "0.1.0"
description = "Explain Git fetch refspec mappings from offline ref snapshots"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "KanadeK"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
refspec-lens = "refspec_lens.cli:main"

[project.urls]
Repository = "https://github.com/KanadeK/refspec-lens"
Issues = "https://github.com/KanadeK/refspec-lens/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
